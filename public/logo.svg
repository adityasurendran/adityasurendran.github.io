<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="squiggle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="50%" style="stop-color:#FFD60A"/>
      <stop offset="100%" style="stop-color:#22C55E"/>
    </linearGradient>
  </defs>
  
  <!-- Squiggle wave -->
  <path d="M20 60 Q40 20, 60 60 T100 60 T140 60 T180 60 T220 60 T260 60 T300 60" 
        stroke="url(#squiggle)" stroke-width="12" fill="none" stroke-linecap="round"/>
  
  <!-- Vault lock icon -->
  <g transform="translate(155, 35)">
    <rect x="0" y="20" width="30" height="24" rx="4" fill="#1e2340"/>
    <rect x="5" y="10" width="20" height="16" rx="3" fill="none" stroke="#1e2340" stroke-width="4"/>
    <circle cx="15" cy="30" r="3" fill="#FFD60A"/>
    <rect x="13.5" y="30" width="3" height="8" fill="#FFD60A"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="55" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="#1e2340" letter-spacing="-1">
    Vault<tspan fill="#2563EB">Drive</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="200" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666" letter-spacing="3">
    YOUR FILES, YOUR CONTROL
  </text>
</svg>
